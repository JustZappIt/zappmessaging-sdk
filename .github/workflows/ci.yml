name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The relay retention test runs against the blind-peer the server deploys.
      - run: cd server && npm ci
      - run: npm test
      - name: Repack Android worklet and verify the checked-in bundle
        run: |
          npm run build:android
          git diff --exit-code -- android/src/main/assets/worklet.bundle
